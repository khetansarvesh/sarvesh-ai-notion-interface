[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sarvesh-ai-notion-interface"
version = "0.1.0.dev1"
description = "Reusable Notion integration helpers for AI-powered job-tracking workflows."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "requests>=2.31",
]
authors = [
  { name = "Sarvesh Khetan" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.6",
  "twine>=6.0",
]

[project.urls]
Repository = "https://github.com/khetansarvesh/sarvesh-ai-notion-interface"
Issues = "https://github.com/khetansarvesh/sarvesh-ai-notion-interface/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sarvesh_ai_notion_interface"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
